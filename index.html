<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voting OSIS</title>

<style>
:root{
  --primary:#2563eb;
  --bg:#f5f7fb;
}

*{margin:0;box-sizing:border-box;font-family:"Segoe UI",sans-serif;}

body{
  background:var(--bg);
  padding:20px;
}

/* HEADER */
header{text-align:center;margin-bottom:20px;}
header h1{font-size:20px;}
header p{font-size:14px;color:#6b7280;}

/* FULLSCREEN BUTTON */
.full-btn{
  position:fixed;
  top:10px;
  right:10px;
  background:var(--primary);
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
  z-index:100;
}

/* LOCK SCREEN */
.lock{
  position:fixed;
  inset:0;
  background:white;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  z-index:999;
}

.lock button{
  margin-top:20px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
}

/* CAROUSEL */
.carousel{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  gap:16px;
  padding:20px 10px;
}
.carousel::-webkit-scrollbar{display:none;}

.card{
  flex:0 0 70%;
  max-width:300px;
  background:white;
  border-radius:16px;
  padding:14px;
  scroll-snap-align:center;
  transition:.3s;
  transform:scale(.9);
  opacity:.6;
}

.card.active{
  transform:scale(1.05);
  opacity:1;
  border:2px solid var(--primary);
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:12px;
}

.card.active img{height:170px;}

.card h3{text-align:center;margin:8px 0;}
.card p{text-align:center;font-size:13px;color:#555;}

.indicator{text-align:center;margin-top:10px;}
.selected{text-align:center;margin-top:5px;font-weight:600;}

.confirm{
  width:100%;
  margin-top:15px;
  padding:14px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:320px;
  text-align:center;
}

.modal button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:8px;
}

.btn-secondary{background:#e5e7eb;}
.btn-primary{background:var(--primary);color:white;}

/* TOAST */
.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%) scale(.9);
  background:#16a34a;
  color:white;
  padding:14px 18px;
  border-radius:12px;
  opacity:0;
  transition:.3s;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
}

</style>
</head>

<body>

<button class="full-btn" onclick="enterFullscreen()">Fullscreen</button>

<div id="lock" class="lock">
  <h2>Mode Voting Aktif</h2>
  <p>Silakan masuk fullscreen untuk melanjutkan</p>
  <button onclick="enterFullscreen()">Masuk Fullscreen</button>
</div>

<header>
<h1>PEMILIHAN KETUA OSIS 2026</h1>
<p>Gunakan hak pilihmu dengan bijak.</p>
</header>

<div id="carousel" class="carousel"></div>

<div class="indicator" id="indicator"></div>
<div class="selected" id="selectedText"></div>

<button class="confirm" onclick="openModal()">KONFIRMASI PILIHAN</button>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-content">
    <h3>Konfirmasi Pilihan</h3>
    <p id="modalText"></p>
    <button class="btn-secondary" onclick="closeModal()">KEMBALI</button>
    <button class="btn-primary" onclick="submitVote()">YA, KONFIRMASI</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast">✓ Pilihan berhasil disimpan</div>

<script>

// HAPTIC
function vibrate(ms=30){
  if(navigator.vibrate) navigator.vibrate(ms);
}

// FULLSCREEN
function enterFullscreen(){
  document.documentElement.requestFullscreen();
}

document.addEventListener("fullscreenchange",()=>{
  if(!document.fullscreenElement){
    document.getElementById("lock").style.display="flex";
  } else {
    document.getElementById("lock").style.display="none";
  }
});

// AUTO TRY FULLSCREEN
setTimeout(()=>{
  enterFullscreen();
},500);

// DATA
const candidates=[
{id:1,chairman:"Nama Ketua 01",vice:"Nama Wakil 01",vision:"Visi singkat pasangan calon.",image:"assets/paslon-01.jpg"},
{id:2,chairman:"Nama Ketua 02",vice:"Nama Wakil 02",vision:"Visi singkat pasangan calon.",image:"assets/paslon-02.jpg"},
{id:3,chairman:"Nama Ketua 03",vice:"Nama Wakil 03",vision:"Visi singkat pasangan calon.",image:"assets/paslon-03.jpg"}
];

const carousel=document.getElementById("carousel");
let activeIndex=0;

// RENDER
candidates.forEach(c=>{
  const el=document.createElement("div");
  el.className="card";
  el.innerHTML=`
    <img src="${c.image}" onerror="this.src='https://via.placeholder.com/300x200'">
    <h3>PASLON ${c.id}</h3>
    <p><b>${c.chairman}</b> & ${c.vice}</p>
    <p>${c.vision}</p>
  `;
  carousel.appendChild(el);
});

// ACTIVE DETECT
function updateActive(){
  const cards=document.querySelectorAll(".card");
  let closest=0,min=Infinity;

  cards.forEach((card,i)=>{
    const rect=card.getBoundingClientRect();
    const offset=Math.abs(rect.left+rect.width/2-window.innerWidth/2);
    if(offset<min){min=offset;closest=i;}
  });

  activeIndex=closest;

  cards.forEach((c,i)=>c.classList.toggle("active",i===activeIndex));

  indicator.innerText=`${activeIndex+1} / ${candidates.length}`;
  selectedText.innerText=`PASLON ${activeIndex+1} TERPILIH`;
}

carousel.addEventListener("scroll",()=>requestAnimationFrame(updateActive));
setTimeout(updateActive,100);

// MODAL
function openModal(){
  vibrate(20);
  modal.style.display="flex";
  modalText.innerText=`Apakah kamu yakin memilih PASLON ${activeIndex+1}?`;
}

function closeModal(){
  modal.style.display="none";
}

// TOAST
function showToast(){
  const t=document.getElementById("toast");
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1500);
}

// SUBMIT
function submitVote(){
  vibrate([40,30,40]);

  let votes=JSON.parse(localStorage.getItem("osis_votes")||"[]");
  votes.push(activeIndex+1);
  localStorage.setItem("osis_votes",JSON.stringify(votes));

  closeModal();
  showToast();

  setTimeout(()=>{
    carousel.scrollTo({left:0,behavior:"smooth"});
  },1600);
}

</script>

</body>
</html>
