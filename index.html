<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voting OSIS</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root{
  --primary:#2563eb;
  --bg:#f5f7fb;
}

*{
  margin:0;
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body{
  background:var(--bg);
  padding:20px;
}

/* =========================================================
   HEADER
========================================================= */

header{
  text-align:center;
  margin-bottom:20px;
}

header h1{
  font-size:20px;
}

header p{
  font-size:14px;
  color:#6b7280;
}

/* =========================================================
   FULLSCREEN
========================================================= */

.full-btn{
  position:fixed;
  top:10px;
  right:10px;
  background:var(--primary);
  color:white;
  border:none;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
  z-index:100;
}

/* =========================================================
   LOCK SCREEN
========================================================= */

.lock{
  position:fixed;
  inset:0;
  background:white;
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  z-index:999;
}

.lock button{
  margin-top:20px;
  padding:12px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
}

/* =========================================================
   VERIFICATION SCREEN
========================================================= */

.verification{
  position:fixed;
  inset:0;
  background:var(--bg);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  z-index:800;
}

.verify-box{
  width:100%;
  max-width:380px;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.verify-box h2{
  text-align:center;
  margin-bottom:8px;
}

.verify-box p{
  text-align:center;
  color:#6b7280;
  font-size:13px;
  margin-bottom:22px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:600;
  margin-bottom:6px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:10px;
  font-size:14px;
  outline:none;
}

.form-group input:focus,
.form-group select:focus{
  border-color:var(--primary);
}

.verify-button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
  font-size:15px;
  font-weight:600;
}

.verify-button:disabled{
  opacity:.6;
}

/* =========================================================
   VOTING AREA
========================================================= */

#votingArea{
  display:none;
}

/* =========================================================
   CAROUSEL WRAPPER
========================================================= */

.carousel-wrapper{
  position:relative;
  width:100%;
  display:flex;
  align-items:center;
}

/* =========================================================
   CAROUSEL
========================================================= */

.carousel{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  gap:16px;
  padding:20px 10px;
  width:100%;
  scroll-behavior:smooth;
}

.carousel::-webkit-scrollbar{
  display:none;
}

/* =========================================================
   CARD
========================================================= */

.card{
  flex:0 0 70%;
  max-width:300px;
  background:white;
  border-radius:16px;
  padding:14px;
  scroll-snap-align:center;
  transition:.3s;
  transform:scale(.9);
  opacity:.6;
  cursor:pointer;
  user-select:none;
}

.card.active{
  transform:scale(1.05);
  opacity:1;
  border:2px solid var(--primary);
  box-shadow:0 8px 20px rgba(0,0,0,.15);
}

.card:active{
  transform:scale(.97);
}

.card.active:active{
  transform:scale(1.02);
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:12px;
}

.card.active img{
  height:170px;
}

.card h3{
  text-align:center;
  margin:8px 0;
}

.card p{
  text-align:center;
  font-size:13px;
  color:#555;
}

/* =========================================================
   NAVIGATION ARROWS
========================================================= */

.nav-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:white;
  color:var(--primary);
  font-size:26px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.18);
  z-index:20;
  cursor:pointer;
}

.nav-arrow:active{
  transform:translateY(-50%) scale(.9);
}

.nav-left{
  left:2px;
}

.nav-right{
  right:2px;
}

.nav-arrow:disabled{
  opacity:.35;
  cursor:default;
}

/* =========================================================
   INDICATOR
========================================================= */

.indicator{
  text-align:center;
  margin-top:10px;
  font-size:13px;
  color:#6b7280;
}

.selected{
  text-align:center;
  margin-top:5px;
  font-weight:600;
}

/* =========================================================
   CONFIRM
========================================================= */

.confirm{
  width:100%;
  margin-top:15px;
  padding:14px;
  border:none;
  border-radius:10px;
  background:var(--primary);
  color:white;
  font-size:15px;
  font-weight:600;
}

.confirm:disabled{
  opacity:.6;
}

/* =========================================================
   MODAL
========================================================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:500;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:12px;
  width:90%;
  max-width:320px;
  text-align:center;
}

.modal button{
  width:100%;
  margin-top:10px;
  padding:12px;
  border:none;
  border-radius:8px;
}

.btn-secondary{
  background:#e5e7eb;
}

.btn-primary{
  background:var(--primary);
  color:white;
}

.btn-primary:disabled{
  opacity:.6;
}

/* =========================================================
   TOAST
========================================================= */

.toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%) scale(.9);
  background:#16a34a;
  color:white;
  padding:14px 18px;
  border-radius:12px;
  opacity:0;
  transition:.3s;
  z-index:1000;
  text-align:center;
  max-width:90%;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
}

.toast.error{
  background:#dc2626;
}

</style>
</head>

<body>

<button class="full-btn" onclick="enterFullscreen()">
  Fullscreen
</button>


<!-- =====================================================
     FULLSCREEN LOCK
===================================================== -->

<div id="lock" class="lock">

  <h2>Mode Voting Aktif</h2>

  <p>
    Silakan masuk fullscreen untuk melanjutkan
  </p>

  <button onclick="enterFullscreen()">
    Masuk Fullscreen
  </button>

</div>


<!-- =====================================================
     VERIFICATION
===================================================== -->

<div id="verification" class="verification">

  <div class="verify-box">

    <h2>Verifikasi Pemilih</h2>

    <p>
      Masukkan data diri sebelum menggunakan hak pilih.
    </p>

    <div class="form-group">

      <label for="nameInput">
        Nama Lengkap
      </label>

      <input
        id="nameInput"
        type="text"
        placeholder="NAMA LENGKAP"
        autocomplete="off"
      >

    </div>


    <div class="form-group">

      <label for="phoneInput">
        Nomor HP
      </label>

      <input
        id="phoneInput"
        type="tel"
        placeholder="08xxxxxxxxxx"
        autocomplete="off"
      >

      <small style="
        display:block;
        margin-top:5px;
        color:#ff4a4a;
        font-size:11px;
      ">
        Wajib
      </small>

    </div>


    <div class="form-group">

      <label for="roleInput">
        Kelas / Jabatan
      </label>

      <select id="roleInput">

        <option value="">
          Pilih kelas / jabatan
        </option>

        <option value="X 1">X 1</option>
        <option value="X 2">X 2</option>
        <option value="X 3">X 3</option>

        <option value="XI 1">XI 1</option>
        <option value="XI 2">XI 2</option>
        <option value="XI 3">XI 3</option>

        <option value="XII 1">XII 1</option>
        <option value="XII 2">XII 2</option>
        <option value="XII 3">XII 3</option>

        <option value="GURU">GURU</option>
        <option value="TU">TU</option>

        <option value="KEPALA SEKOLAH">
          KEPALA SEKOLAH
        </option>

      </select>

    </div>


    <button
      id="verifyButton"
      class="verify-button"
      onclick="verifyVoter()"
    >
      VERIFIKASI
    </button>

  </div>

</div>


<!-- =====================================================
     VOTING AREA
===================================================== -->

<div id="votingArea">

  <header>

    <h1>
      PEMILIHAN KETUA OSIS 2026
    </h1>

    <p>
      Gunakan hak pilihmu dengan bijak.
    </p>

  </header>


  <div class="carousel-wrapper">

    <button
      id="prevButton"
      type="button"
      class="nav-arrow nav-left"
      onclick="previousCandidate()"
      aria-label="Paslon sebelumnya"
    >
      ‹
    </button>


    <div
      id="carousel"
      class="carousel"
    ></div>


    <button
      id="nextButton"
      type="button"
      class="nav-arrow nav-right"
      onclick="nextCandidate()"
      aria-label="Paslon berikutnya"
    >
      ›
    </button>

  </div>


  <div
    class="indicator"
    id="indicator"
  ></div>


  <div
    class="selected"
    id="selectedText"
  ></div>


  <button
    id="confirmButton"
    class="confirm"
    onclick="openModal()"
  >
    KONFIRMASI PILIHAN
  </button>

</div>


<!-- =====================================================
     MODAL
===================================================== -->

<div
  id="modal"
  class="modal"
>

  <div class="modal-content">

    <h3>
      Konfirmasi Pilihan
    </h3>

    <p id="modalText"></p>

    <button
      class="btn-secondary"
      onclick="closeModal()"
      id="cancelButton"
    >
      KEMBALI
    </button>

    <button
      class="btn-primary"
      onclick="submitVote()"
      id="submitButton"
    >
      YA, KONFIRMASI
    </button>

  </div>

</div>


<!-- =====================================================
     TOAST
========================================================= -->

<div
  id="toast"
  class="toast"
>
  ✓ Pilihan berhasil disimpan
</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
  "https://cmaijcbefshdxjewxcyb.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_nTP29nUK8WCKNiDr7Jndug_gQEJs6kG";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   STATE
========================================================= */

let activeIndex = 0;

let submitting = false;

let verifiedVoterId = null;

let scrollTimer = null;


/* =========================================================
   HAPTIC
========================================================= */

function vibrate(ms=30){

  if(navigator.vibrate){

    navigator.vibrate(ms);

  }

}


/* =========================================================
   FULLSCREEN
========================================================= */

function enterFullscreen(){

  if(!document.fullscreenElement){

    document.documentElement
      .requestFullscreen()
      .catch(error=>{

        console.log(
          "Fullscreen gagal:",
          error
        );

      });

  }

}


document.addEventListener(
  "fullscreenchange",
  ()=>{

    if(!document.fullscreenElement){

      document.getElementById(
        "lock"
      ).style.display="flex";

    }else{

      document.getElementById(
        "lock"
      ).style.display="none";

    }

  }
);


/* =========================================================
   AUTO TRY FULLSCREEN
========================================================= */

setTimeout(()=>{

  enterFullscreen();

},500);


/* =========================================================
   DATA PASLON
========================================================= */

const candidates=[

  {
    id:1,
    chairman:"Nama Ketua 01",
    vice:"Nama Wakil 01",
    vision:"Visi singkat pasangan calon.",
    image:"assets/paslon-01.jpg"
  },

  {
    id:2,
    chairman:"Nama Ketua 02",
    vice:"Nama Wakil 02",
    vision:"Visi singkat pasangan calon.",
    image:"assets/paslon-02.jpg"
  },

  {
    id:3,
    chairman:"Nama Ketua 03",
    vice:"Nama Wakil 03",
    vision:"Visi singkat pasangan calon.",
    image:"assets/paslon-03.jpg"
  }

];


/* =========================================================
   ELEMENTS
========================================================= */

const carousel =
  document.getElementById(
    "carousel"
  );


/* =========================================================
   VERIFICATION
========================================================= */

async function verifyVoter(){

  const nameInput =
    document.getElementById(
      "nameInput"
    );

  const roleInput =
    document.getElementById(
      "roleInput"
    );

  const verifyButton =
    document.getElementById(
      "verifyButton"
    );


  const name =
    nameInput.value
      .trim()
      .replace(/\s+/g," ")
      .toUpperCase();


  const role =
    roleInput.value;


  if(!name){

    showToast(
      "Masukkan nama lengkap.",
      true
    );

    nameInput.focus();

    return;

  }


  if(!role){

    showToast(
      "Pilih kelas / jabatan.",
      true
    );

    roleInput.focus();

    return;

  }


  verifyButton.disabled=true;

  verifyButton.innerText =
    "MEMERIKSA...";


  try{

    const { data, error } =
      await supabaseClient
        .from("voters")
        .select(
          "id,name,role,has_voted"
        )
        .eq("name",name)
        .eq("role",role)
        .maybeSingle();


    if(error){

      console.error(
        "Verification error:",
        error
      );

      throw error;

    }


    if(!data){

      showToast(
        "⚠ Data pemilih tidak ditemukan.",
        true
      );

      return;

    }


    if(data.has_voted){

      showToast(
        "⚠ Kamu sudah menggunakan hak pilih.",
        true
      );

      return;

    }


    verifiedVoterId =
      data.id;


    document.getElementById(
      "verification"
    ).style.display="none";


    document.getElementById(
      "votingArea"
    ).style.display="block";


    vibrate([30,50,30]);


    showToast(
      "✓ Verifikasi berhasil."
    );


    updateVisuals();


  }catch(error){

    console.error(error);

    showToast(
      "⚠ Gagal memverifikasi. Periksa koneksi.",
      true
    );

  }finally{

    verifyButton.disabled=false;

    verifyButton.innerText =
      "VERIFIKASI";

  }

}


/* =========================================================
   RENDER CARD
========================================================= */

candidates.forEach((c,index)=>{

  const el =
    document.createElement(
      "div"
    );

  el.className="card";

  el.innerHTML=`

    <img
      src="${c.image}"
      onerror="this.src='assets/placeholder.jpg'"
    >

    <h3>PASLON ${c.id}</h3>

    <p>
      <b>${c.chairman}</b> & ${c.vice}
    </p>

    <p>
      ${c.vision}
    </p>

  `;


  /* =========================================
     TAP / CLICK CARD
  ========================================= */

  el.addEventListener(
    "click",
    ()=>{
      selectCandidate(index);
    }
  );


  carousel.appendChild(el);

});


/* =========================================================
   SELECT CANDIDATE
========================================================= */

function selectCandidate(index){

  if(index<0) return;

  if(index>=candidates.length) return;


  activeIndex=index;


  /*
     UPDATE VISUAL TERLEBIH DAHULU.

     Tidak lagi menjalankan logika
     "siapa yang paling dekat dengan
     tengah layar".
  */

  updateVisuals();


  const card =
    document.querySelectorAll(
      ".card"
    )[index];


  if(card){

    card.scrollIntoView({
      behavior:"smooth",
      block:"nearest",
      inline:"center"
    });

  }


  vibrate(20);

}


/* =========================================================
   NEXT / PREVIOUS
========================================================= */

function nextCandidate(){

  if(activeIndex >= candidates.length-1){

    return;

  }


  selectCandidate(
    activeIndex+1
  );

}


function previousCandidate(){

  if(activeIndex <= 0){

    return;

  }


  selectCandidate(
    activeIndex-1
  );

}


/* =========================================================
   UPDATE VISUALS
=========================================================

   FUNGSI INI HANYA MENGIKUTI activeIndex.

   Tidak menghitung posisi card.
   Tidak mengubah activeIndex.

========================================================= */

function updateVisuals(){

  const cards =
    document.querySelectorAll(
      ".card"
    );


  cards.forEach((c,i)=>{

    c.classList.toggle(
      "active",
      i===activeIndex
    );

  });


  document.getElementById(
    "indicator"
  ).innerText =
    `${activeIndex+1} / ${candidates.length}`;


  document.getElementById(
    "selectedText"
  ).innerText =
    `PASLON ${activeIndex+1} TERPILIH`;


  document.getElementById(
    "prevButton"
  ).disabled =
    activeIndex===0;


  document.getElementById(
    "nextButton"
  ).disabled =
    activeIndex===candidates.length-1;

}


/* =========================================================
   DETECT SWIPE / MANUAL SCROLL
=========================================================

   Hanya fungsi ini yang boleh mengubah
   activeIndex berdasarkan posisi carousel.

========================================================= */

function detectSwipeSelection(){

  const cards =
    document.querySelectorAll(
      ".card"
    );


  if(!cards.length) return;


  /*
     Gunakan TENGAH CAROUSEL,
     bukan tengah WINDOW.

     Ini penting untuk Windows landscape.
  */

  const carouselRect =
    carousel.getBoundingClientRect();


  const carouselCenter =
    carouselRect.left +
    carouselRect.width / 2;


  let closestIndex=activeIndex;

  let minDistance=Infinity;


  cards.forEach((card,i)=>{

    const rect =
      card.getBoundingClientRect();


    const cardCenter =
      rect.left +
      rect.width / 2;


    const distance =
      Math.abs(
        cardCenter -
        carouselCenter
      );


    if(distance<minDistance){

      minDistance=distance;

      closestIndex=i;

    }

  });


  if(closestIndex!==activeIndex){

    activeIndex=closestIndex;

    updateVisuals();

    vibrate(15);

  }else{

    /*
       Tetap update visual supaya
       snap position dan state tetap sinkron.
    */

    updateVisuals();

  }

}


/* =========================================================
   CAROUSEL SCROLL
========================================================= */

carousel.addEventListener(
  "scroll",
  ()=>{

    /*
       Tunggu scroll berhenti sebentar.

       Jadi saat user sedang swipe,
       activeIndex tidak terus-menerus
       berubah setiap frame.
    */

    clearTimeout(scrollTimer);


    scrollTimer =
      setTimeout(()=>{

        detectSwipeSelection();

      },120);

  }
);


/* =========================================================
   MODAL
========================================================= */

function openModal(){

  if(submitting) return;

  vibrate(20);


  document.getElementById(
    "modal"
  ).style.display="flex";


  document.getElementById(
    "modalText"
  ).innerText =
    `Apakah kamu yakin memilih PASLON ${activeIndex+1}?`;

}


function closeModal(){

  if(submitting) return;

  document.getElementById(
    "modal"
  ).style.display="none";

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
  message,
  isError=false
){

  const t =
    document.getElementById(
      "toast"
    );


  t.innerText =
    message;


  t.classList.toggle(
    "error",
    isError
  );


  t.classList.add(
    "show"
  );


  setTimeout(()=>{

    t.classList.remove(
      "show"
    );

  },2500);

}


/* =========================================================
   SUBMIT VOTE
========================================================= */

async function submitVote(){

  if(submitting) return;


  if(!verifiedVoterId){

    showToast(
      "⚠ Pemilih belum diverifikasi.",
      true
    );

    return;

  }


  submitting=true;


  const submitButton =
    document.getElementById(
      "submitButton"
    );

  const cancelButton =
    document.getElementById(
      "cancelButton"
    );

  const confirmButton =
    document.getElementById(
      "confirmButton"
    );


  submitButton.disabled=true;

  cancelButton.disabled=true;

  confirmButton.disabled=true;


  vibrate([40,30,40]);


  const candidateId =
    activeIndex+1;


  try{

    /* =========================================
       1. SIMPAN SUARA
    ========================================= */

    const { error:voteError } =
      await supabaseClient
        .from("votes")
        .insert({
          candidate:candidateId
        });


    if(voteError){

      console.error(
        "Vote error:",
        voteError
      );

      throw voteError;

    }


    /* =========================================
       2. TANDAI VOTER SUDAH MEMILIH
    ========================================= */

    const { data:updatedVoter, error:updateError } =
  await supabaseClient
    .from("voters")
    .update({
      has_voted:true
    })
    .eq("id",verifiedVoterId)
    .eq("has_voted",false)
    .select("id,has_voted");


if(updateError){

  console.error(
    "Voter update error:",
    updateError
  );

  throw updateError;

}


if(!updatedVoter || updatedVoter.length === 0){

  console.error(
    "Voter tidak berhasil di-update."
  );

  throw new Error(
    "Voter update tidak mengubah data."
  );

}


    /* =========================================
       SUCCESS
    ========================================= */

    closeModal();


    showToast(
      "✓ Pilihan berhasil disimpan"
    );


    verifiedVoterId = null;

confirmButton.disabled = true;

setTimeout(() => {

  // Sembunyikan voting
  document.getElementById(
    "votingArea"
  ).style.display = "none";

  // Tampilkan kembali halaman verifikasi
  document.getElementById(
    "verification"
  ).style.display = "flex";

  // Bersihkan input
  document.getElementById(
    "nameInput"
  ).value = "";

  document.getElementById(
    "phoneInput"
  ).value = "";

  document.getElementById(
    "roleInput"
  ).value = "";

  // Kembalikan pilihan ke paslon pertama
  activeIndex = 0;

  carousel.scrollTo({
    left: 0,
    behavior: "instant"
  });

  updateActive();

}, 0);


  }catch(error){

    console.error(error);


    showToast(
      "⚠ Gagal menyimpan. Periksa koneksi lalu coba lagi.",
      true
    );


  }finally{

    submitting=false;

    submitButton.disabled=false;

    cancelButton.disabled=false;


    if(!verifiedVoterId){

      confirmButton.disabled=true;

    }else{

      confirmButton.disabled=false;

    }

  }

}


/* =========================================================
   INITIAL ACTIVE
========================================================= */

setTimeout(()=>{

  updateVisuals();

},100);

</script>
